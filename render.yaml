services:
  # Backend API — deployed on Render
  - type: web
    name: ssc-backend
    runtime: node
    plan: free
    rootDir: backend
    # typescript lives in dependencies + postinstall builds dist/; this stays explicit.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      # Exact browser origin of the Vercel app (no trailing slash). Required for CORS.
      - key: FRONTEND_URL
        value: https://myexamprep-theta.vercel.app
      # Optional: comma-separated extra origins (preview deployments, custom domains)
      - key: FRONTEND_URLS
        sync: false
      # Public URL used by Render cron/pinger to keep the free instance awake.
      - key: KEEPALIVE_URL
        value: https://ssc-0p96.onrender.com
      # Required for OTP / forgot-password emails (set in Render dashboard).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # Ping the API every 5 minutes to prevent Render free-tier sleep.
  - type: cron
    name: ssc-backend-keepalive
    runtime: node
    schedule: "*/5 * * * *"
    rootDir: backend
    buildCommand: npm install
    startCommand: >
      node -e "const url = (process.env.KEEPALIVE_URL || 'https://ssc-0p96.onrender.com') + '/keepalive'; fetch(url).then(async (res) => { if (!res.ok) { throw new Error('keepalive failed: ' + res.status); } const data = await res.text(); console.log('keepalive ok', res.status, data.slice(0, 80)); }).catch((err) => { console.error(err); process.exit(1); });"
    envVars:
      - key: KEEPALIVE_URL
        value: https://ssc-0p96.onrender.com

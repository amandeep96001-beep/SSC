services:
  # Backend API — use at least "standard" for production scale (not free sleep tier).
  - type: web
    name: ssc-backend
    runtime: node
    plan: standard
    rootDir: backend
    # typescript lives in dependencies + postinstall builds dist/; this stays explicit.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    scaling:
      minInstances: 2
      maxInstances: 10
      targetMemoryPercent: 70
      targetCPUPercent: 70
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      # Exact browser origin of the Vercel app (no trailing slash). Required for CORS.
      - key: FRONTEND_URL
        value: https://myexamprep-theta.vercel.app
      # Optional: comma-separated extra origins (preview deployments, custom domains)
      - key: FRONTEND_URLS
        sync: false
      # Shared Redis for rate limits + auth/AI caches across instances
      - key: REDIS_URL
        fromService:
          name: ssc-redis
          type: redis
          property: connectionString
      - key: MONGODB_MAX_POOL
        value: "50"
      - key: AUTH_CACHE_TTL_SEC
        value: "45"
      - key: RATE_LIMIT_API_MAX
        value: "1200"
      # Required for OTP / forgot-password emails (set in Render dashboard).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REMINDER_CRON
        value: "1"

  # Optional managed Redis on Render — set REDIS_URL on the web service to this instance.
  - type: redis
    name: ssc-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
